# ====================================================================
# 一键起全套依赖：PG(pgvector) + MySQL(RBAC) + Milvus(etcd+minio) + 应用
#
# 用法：
#   docker compose up -d            # 首次会构建镜像并初始化两张库
#   docker compose logs -f app      # 看应用日志
#   docker compose down             # 停止（数据卷保留）
#   docker compose down -v          # 连数据一起清掉
#
# 验证：
#   curl http://localhost:8000/health
#   curl -H "X-API-Key: <你的key>" http://localhost:8000/me
# ====================================================================
services:
  # ---- 会话库：对话历史 / 工具日志 / 记忆向量（pgvector）----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-agent}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agent123}
      POSTGRES_DB: ${PG_DB:-agent_db}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      # 【为什么要挂载 init_db.sql】容器首次启动才会执行 /docker-entrypoint-initdb.d 下的脚本，
      #   建表 + 建 pgvector 扩展一次到位，不用手工 psql 导入。
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-agent} -d ${PG_DB:-agent_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 身份权限库：用户 / 角色 / 权限 / 审计 / 用量 ----
  mysql:
    image: mysql:8.0
    container_name: agent-mysql
    environment:
      # 【为什么库名默认 ai_agent_enterprise】必须与 config.py 的 mysql_database 默认值、
      #   mysql_init.sql 里的库名三者一致，否则应用连上来会报 Unknown database，
      #   而且只在"首次启动"时暴露，很难联想到是名字打错了。
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-agent123}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_agent_enterprise}
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql_init.sql:/docker-entrypoint-initdb.d/mysql_init.sql:ro
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_PASSWORD:-agent123}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Milvus 依赖：元数据 etcd + 对象存储 minio ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: agent-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcdata:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: agent-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - miniodata:/minio_data

  # ---- 向量库：知识库文档分片 ----
  standalone:
    image: milvusdb/milvus:v2.4.5
    container_name: agent-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvusdata:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio

  # ---- 应用 ----
  app:
    build: .
    container_name: agent-app
    env_file:
      - .env
    environment:
      # 【为什么要覆盖 host】容器里 localhost 指自己，访问不到其他容器；
      #   用 compose 服务名做主机名，Docker 内置 DNS 会解析到对应容器。
      PG_HOST: postgres
      PG_USER: ${PG_USER:-agent}
      PG_PASSWORD: ${PG_PASSWORD:-agent123}
      PG_DATABASE: ${PG_DB:-agent_db}
      MYSQL_HOST: mysql
      # 【为什么显式写 root/密码】应用默认连的是 root 且密码为空，
      #   而 compose 起的 MySQL root 密码是 agent123，不写就是 Access denied。
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent123}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_agent_enterprise}
      MILVUS_HOST: standalone
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      standalone:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
  etcdata:
  miniodata:
  milvusdata:
